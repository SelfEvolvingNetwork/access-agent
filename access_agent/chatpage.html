<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پرستو — گفتگو با عامل</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --line:#26304a; --txt:#e8edf7;
          --dim:#8b96ad; --me:#2f6feb; --me-txt:#fff; --ok:#3fbf6f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Vazirmatn,Tahoma,'Segoe UI',sans-serif;
         background:var(--bg); color:var(--txt); height:100dvh;
         display:flex; flex-direction:column; }
  header { padding:10px 14px; border-bottom:1px solid var(--line);
           display:flex; gap:8px; align-items:center; font-size:14px; color:var(--dim); }
  header b { color:var(--txt); font-size:15px; }
  #dot { width:8px; height:8px; border-radius:50%; background:#c33; display:inline-block; }
  #dot.on { background:var(--ok); }
  #msgs { flex:1; overflow-y:auto; padding:14px; display:flex;
          flex-direction:column; gap:8px; }
  .row { display:flex; }
  .row.host { justify-content:flex-start; }
  .row.agent { justify-content:flex-end; }
  .bub { max-width:78%; padding:8px 12px; border-radius:14px; line-height:1.7;
         white-space:pre-wrap; word-break:break-word; font-size:14px;
         border:1px solid var(--line); background:var(--card); }
  .row.host .bub { border-color:#33456e; }
  .row.agent .bub { background:var(--me); border-color:var(--me); color:var(--me-txt); }
  .meta { font-size:10px; opacity:.65; margin-top:4px; }
  #replybar { display:none; background:var(--card); border:1px solid var(--line);
              border-radius:8px; margin:0 14px 6px; padding:6px 10px; font-size:12px;
              color:var(--dim); cursor:pointer; }
  #auth { margin:auto; background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:22px; width:min(92%,380px); text-align:center; }
  #auth input { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line);
                background:var(--bg); color:var(--txt); font-size:13px; margin:12px 0; }
  #auth button, #send button { background:var(--me); color:var(--me-txt); border:0;
                border-radius:8px; padding:10px 18px; font-size:14px; cursor:pointer;
                font-family:inherit; }
  #err { color:#ff8484; font-size:12px; min-height:16px; }
  footer { border-top:1px solid var(--line); padding:10px 14px; display:flex; gap:8px; }
  #send { flex:1; resize:none; background:var(--card); color:var(--txt);
          border:1px solid var(--line); border-radius:10px; padding:10px 12px;
          font-family:inherit; font-size:14px; height:44px; max-height:120px; }
  #send:disabled { opacity:.5; }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <b>گفتگو با عامل</b>
  <span>پل access-agent — تاریخچه روی سرور خودت</span>
</header>

<div id="auth" hidden>
  <div><b>ورود به چت</b></div>
  <div style="color:var(--dim);font-size:12px;margin-top:8px">
    توکن محدود چت (از اپ موبایل یا ادمین سرور) — توکن ادمین را اینجا نگذارید.
  </div>
  <input id="tok" placeholder="aachat_…" autocomplete="off">
  <button id="go">ورود</button>
  <div id="err"></div>
</div>

<div id="chat" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div id="msgs"></div>
  <div id="replybar"></div>
  <footer>
    <textarea id="send" maxlength="4000" placeholder="پیام… (Enter = ارسال، Shift+Enter = خط جدید)"></textarea>
    <button id="go2">ارسال</button>
  </footer>
</div>

<script>
"use strict";
var lastId = 0, seen = {}, replyTo = null, es = null;
var $ = function (id) { return document.getElementById(id); };
var msgsEl = $("msgs"), sendEl = $("send");

function esc(s) { var d = document.createElement("div"); d.textContent = s; return d; }

function bubble(m) {
  var row = document.createElement("div");
  row.className = "row " + (m.sender === "agent" ? "agent" : "host");
  var b = document.createElement("div");
  b.className = "bub";
  b.appendChild(esc(m.text));
  var meta = document.createElement("div");
  meta.className = "meta";
  var t = "";
  try { t = new Date(m.ts).toLocaleString("fa-IR"); } catch (e) { t = m.ts; }
  var who = m.sender === "agent" ? "عامل" : "من";
  meta.textContent = who + " · " + t + (m.sender === "agent" && m.read_at ? " · دیده شد" : "");
  if (m.reply_to) {
    var r = document.createElement("div");
    r.style.fontSize = "10px"; r.style.opacity = ".7";
    r.textContent = "↩ پاسخ به #" + m.reply_to;
    b.appendChild(document.createElement("br"));
    b.appendChild(r);
  }
  b.appendChild(meta);
  b.ondblclick = function () { setReply(m.id); };
  row.appendChild(b);
  return row;
}

function render(list) {
  var atBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 60;
  list.forEach(function (m) {
    if (seen[m.id]) return;
    seen[m.id] = 1;
    if (m.id > lastId) lastId = m.id;
    msgsEl.appendChild(bubble(m));
  });
  if (atBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
}

function setReply(id) {
  replyTo = id;
  $("replybar").style.display = "block";
  $("replybar").textContent = "پاسخ به #" + id + " — برای لغو کلیک کنید";
}
$("replybar").onclick = function () { replyTo = null; this.style.display = "none"; };

function load() {
  fetch("/api/chat/messages?since_id=" + lastId, { credentials: "same-origin" })
    .then(function (r) { if (r.status === 401) throw new Error("auth"); return r.json(); })
    .then(function (d) { if (d.ok) { render(d.messages); markRead(); } })
    .catch(function (e) { if (e.message === "auth") showAuth(); });
}

function markRead() {
  fetch("/api/chat/read", { method: "POST", credentials: "same-origin" });
}

function stream() {
  try { if (es) es.close(); } catch (e) {}
  es = new EventSource("/api/chat/stream?backfill=0");
  es.onopen = function () { $("dot").className = "on"; };
  es.onerror = function () { $("dot").className = ""; };
  es.onmessage = function (ev) {
    try { render([JSON.parse(ev.data)]); markRead(); } catch (e) {}
  };
}

function doSend() {
  var v = sendEl.value.trim();
  if (!v) return;
  var body = { text: v };
  if (replyTo) body.reply_to = replyTo;
  sendEl.disabled = true;
  fetch("/api/chat/send", { method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      sendEl.disabled = false;
      if (d.ok) { sendEl.value = ""; sendEl.style.height = "44px";
                  replyTo = null; $("replybar").style.display = "none"; load(); }
      else alert("خطا: " + (d.error || "?"));
    })
    .catch(function () { sendEl.disabled = false; });
}

function showAuth() {
  $("auth").hidden = false; $("chat").hidden = true;
  try { if (es) es.close(); } catch (e) {}
}

$("go").onclick = function () {
  var t = $("tok").value.trim();
  if (!t) return;
  fetch("/api/chat/auth", { method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: t }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.ok) { $("auth").hidden = true; $("chat").hidden = false;
                  $("tok").value = ""; $("err").textContent = "";
                  lastId = 0; seen = {}; load(); stream(); }
      else $("err").textContent = "توکن نامعتبر است";
    });
};
$("tok").addEventListener("keydown", function (e) { if (e.key === "Enter") $("go").click(); });
$("go2").onclick = doSend;
sendEl.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); }
});
sendEl.addEventListener("input", function () {
  sendEl.style.height = "44px";
  sendEl.style.height = Math.min(sendEl.scrollHeight, 120) + "px";
});

/* صفحه: اول کوکی را امتحان کن؛ نبود → فرم ورود */
fetch("/api/chat/messages?since_id=0", { credentials: "same-origin" })
  .then(function (r) { if (r.status === 401) throw new Error("auth"); return r.json(); })
  .then(function (d) {
    if (!d.ok) return showAuth();
    $("chat").hidden = false;
    render(d.messages); markRead(); stream();
    setInterval(load, 10000); /* پشتیبان SSE */
  })
  .catch(showAuth);
</script>
</body>
</html>
